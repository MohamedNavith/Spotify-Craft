version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wavelength-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wavelength}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wavelength_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-wavelength_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wavelength} -d ${POSTGRES_DB:-wavelength_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wavelength-network

  redis:
    image: redis:7-alpine
    container_name: wavelength-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wavelength-network

  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: wavelength-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-wavelength_meili_master_key_2026}
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: ${NODE_ENV:-development}
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7700/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wavelength-network

  minio:
    image: minio/minio:RELEASE.2024-01-31T20-20-33Z
    container_name: wavelength-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadminpassword}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - wavelength-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wavelength-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-wavelength}:${POSTGRES_PASSWORD:-wavelength_secure_password}@postgres:5432/${POSTGRES_DB:-wavelength_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-wavelength_meili_master_key_2026}
      JWT_SECRET: ${JWT_SECRET:-wavelength-dev-jwt-super-secret-key-change-in-production-2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-wavelength-dev-refresh-token-super-secret-change-in-production}
      JAMENDO_CLIENT_ID: ${JAMENDO_CLIENT_ID:-17ed92bf}
      JAMENDO_BASE_URL: https://api.jamendo.com/v3.0
      APP_URL: ${APP_URL:-http://localhost:3000}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - wavelength-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wavelength-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - wavelength-network

  discord-bot:
    build:
      context: ./discord-bot
      dockerfile: Dockerfile
    container_name: wavelength-discord-bot
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      CLIENT_ID: ${CLIENT_ID}
      DEFAULT_PREFIX: ${DEFAULT_PREFIX:-!w}
      DEFAULT_VOLUME: ${DEFAULT_VOLUME:-80}
      WAVELENGTH_WEB_URL: ${WAVELENGTH_WEB_URL:-https://mohamednavith.github.io/Spotify-Craft/}
    volumes:
      - bot_data:/app/data
    networks:
      - wavelength-network

networks:
  wavelength-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  meili_data:
  minio_data:
  bot_data:

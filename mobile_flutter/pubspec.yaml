name: wavelength_app
description: "Wavelength - Hi-Res & Lossless Music Streaming"
publish_to: 'none'
version: 2.0.0+6

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  http: ^1.6.0
  sqflite: ^2.4.6
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  cached_network_image: ^4.0.7
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  file_picker: ^13.4.1
  permission_handler: ^13.0.2
  url_launcher: ^6.3.3
  dart_des: ^1.0.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/wavelength-icon.png
    - assets/artists/

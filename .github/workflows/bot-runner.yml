name: Wavelength 24/7 Discord Bot Runner

on:
  workflow_dispatch:
  schedule:
    # Fallback safety net trigger every 5 hours
    - cron: '0 */5 * * *'
  push:
    paths:
      - 'discord-bot/**'

concurrency:
  group: wavelength-discord-bot-service
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  run-bot:
    name: Discord Bot Daemon
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: discord-bot/package-lock.json

      - name: Install System Audio Utilities (FFmpeg & Libopus)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg libopus0 libopus-dev

      - name: Install Bot Dependencies
        working-directory: ./discord-bot
        run: |
          npm ci --legacy-peer-deps
          chmod +x node_modules/ffmpeg-static/ffmpeg 2>/dev/null || true

      - name: Compile Bot TypeScript
        working-directory: ./discord-bot
        run: npm run build

      - name: Run Wavelength Bot with Daisy-Chain Relay Supervisor
        working-directory: ./discord-bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN || vars.DISCORD_TOKEN || secrets.discord_token || vars.discord_token }}
          CLIENT_ID: ${{ secrets.CLIENT_ID || vars.CLIENT_ID || secrets.client_id || vars.client_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NODE_ENV: production
        run: |
          if [ -z "$DISCORD_TOKEN" ]; then
            echo "::error::DISCORD_TOKEN secret is missing in GitHub repository settings!"
            echo "Please go to: https://github.com/MohamedNavith/Spotify-Craft/settings/secrets/actions"
            echo "Click 'New repository secret', name it DISCORD_TOKEN, and paste your bot token."
            exit 1
          fi

          echo "Starting Wavelength Bot 24/7 Daisy-Chain Relay Supervisor..."
          node supervisor.js
